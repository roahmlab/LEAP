# conda environment of the tracking study:
#   conda env create -f environment.yml && conda activate leap_track
name: leap_track
channels:
  - conda-forge
dependencies:
  - python=3.12.14
  - numpy=2.5.2
  - scipy=1.18.0
  - libblas=3.11.0=*openblas
  - libopenblas=0.3.34=openmp*
  - pinocchio=4.1.0
  - h5py=3.16.0
  - pyyaml=6.0.3
  - matplotlib=3.11.1
  - pillow=12.3.0
  - pip
  - pip:
      - mujoco==3.12.0
      - proxsuite==0.7.3
      - imageio==2.37.4
      - imageio-ffmpeg==0.6.0
