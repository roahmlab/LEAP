solver:                       # the shared v2 recipe; per-robot slots are marked
  backend: cholmod_sn         # pattern/fallback backend; the solve itself is
  blockdense: true            # the task-parallel dense per-segment Cholesky
  lowtri: true
  cscale: 1                   # unit-normalized penalties (metres vs Newtons)
  mumax: 1.0e7
  rhoabs: 3.0e8               # LS dynamics-defect weight, decoupled from mumax
  elimu: false
  split: 1
  lsqnq: 12                   # off-node LS dynamics-defect quadrature points
  dsseg: 0.025                # window length (the production hopscotch value)
  hmaxfar1: 4.5e-3
  hmaxnear1: 1.8e-3
  hmaxnear: 1.9e-3            # phase-B near cap raised to the far cap
  growgate: true              # ||F||-gated adaptive step growth
  solveretry: 3               # shrink-and-retry on a failed linear solve
  blowup: 10                  # window-level abort once the flow explodes
  keepbesta: true             # phase A hands over its best iterate
  smax1: 2.4                  # phase-A budget
  stall: 12
  gspike: 5.0                 # ||F||-spike h shrink (the hopscotch guard)
  blowupretry: 2              # roll back and retry a blown window before aborting
  smax2: 0.15
  stopgate: 3.0e-3            # phase-B early stop on the zero-dual gate
  stopinter: 2.0e-2           # ... and on the inter-node dynamics probe
  restore: 0.5                # fixed-dual feasibility-restoration endgame
  restoremu: 1.0e9
  restoregate: 1.0e-3
  restoreh: 2.5e-3            # restoration STARTS here ...
  restorehmax: 0.05           # ... and may grow to here: the momentum-free
                              # fixed-mu theta=1 step at large h approaches a
                              # damped Gauss-Newton step
  exchange: 4                 # relocation rounds: move the off-node rows onto
  exsmax: 0.06                # the between-node violation maxima, re-polish,
  exgate: 1.5e-3              # repeat until the unit-free dense scan is clean
  fastgate: true
