problem:
  type: terrain_walk
  tstart: 0.3961      # initial support, starts at rest (1.60 sqrt(h/g))
  mu: 0.8
  friceps: 1.0e-2
  copx: 0.020               # CoP box: |ty| <= copx*fz, |tx| <= copy*fz. The sole is
  copy: 0.020               # 0.05 x 0.05 m (foot_box 0.025): 20 % margin per side
  gammaz: 0.05                # |tz| <= gammaz*fz (yaw friction)
  lammin: 2.433             # per-contact normal-force floor in stance: 2% of the
