  zeroland: true              # flat foot + ankle: impulse-free touchdown
  selfcolmargin: 0.02
  selfcolinterp: 2
  selfcolpairs:
  - {a: torso, b: shank}
  wvel: 0.5                 # joint-motion (path length) objective weight:
