# G1 (29 DOF) fence jump: the fence-jump benchmark instance (docs/REPRODUCE.md section 2).
# Solve it with scripts/run_benchmark.sh fence g1_29dof <cpulist>; every transcription setting
# of the benchmark is in this file, so `leap_solve <this file>` poses the same instance.
schema: 1
name: g1_29dof_jump_fence_sc
robot: ../robots/g1_29dof.yaml
problem:
  liftofffull: true
  ownership: true
  strictrest: true
  landfootpin: true
  seedmode: 1
  contactposall: true
  type: jump_fence_v2
  tstance: 0.6
  tair: 0.37
  hop: 0.152
  step:
  - 0.464
  - 0.0
  mu: 0.85
  lammin: 5.0
  landvz: 0.5
  footclear: 0.0
  attmax: 0.5
  ulim: 1.0
  selfcolmargin: 0.015
  selfcolinterp: 3
  selfcolpairs:
  - {a: left_farm, b: right_farm}
  - {a: left_farm, b: left_thigh}
  - {a: right_farm, b: right_thigh}
  - {a: left_farm, b: right_thigh}
  - {a: right_farm, b: left_thigh}
  - {a: left_thigh, b: right_thigh, margin: 0.005}
  - {a: left_shank, b: right_shank, margin: 0.005}
  - {a: left_sole, b: right_sole, margin: 0.005}
  - {a: left_shank, b: right_sole, margin: 0.005}
  - {a: left_sole, b: right_shank, margin: 0.005}
  - {a: left_thigh, b: right_shank, margin: 0.005}
  - {a: left_shank, b: right_thigh, margin: 0.005}
  - {a: torso, b: left_thigh}
  - {a: torso, b: right_thigh}
  vlim: 1.0
  qbox: 1.0
  copx: 0.07225
  copy: 0.0255
  gammaz: 0.05
  poses:
  - joint: left_hip_pitch_joint
    stand: -0.3
    squat: -0.6
  - joint: left_knee_joint
    stand: 0.6
    squat: 1.2
  - joint: left_ankle_pitch_joint
    stand: -0.30000000000000004
    squat: -0.5999999999999999
  - joint: left_ankle_roll_joint
    stand: 0.0
    squat: 1.2924697071141057e-26
  - joint: right_hip_pitch_joint
    stand: -0.3
    squat: -0.6
  - joint: right_knee_joint
    stand: 0.6
    squat: 1.2
  - joint: right_ankle_pitch_joint
    stand: -0.30000000000000004
    squat: -0.5999999999999998
  - joint: right_ankle_roll_joint
    stand: 4.303539764539855e-27
    squat: -4.3009035516319776e-27
  ubern: true
  impactcone: true            # friction-cone admissibility of the
                              # plastic touchdown impulse
obstacles:
  margin: 0.02
  interp: 3
  boxes:
  - name: fence
    center:
    - 0.32
    - 0.0
    - 0.05
    size:
    - 0.05
    - 0.8
    - 0.1
  smooth: 0   # exact separating-face certificate
  rounded: true   # exact rounded capsule-box distance outside the box
solver:
  lsqnqs:
  - 8
  - 8
  - 8
  hnear: 20.0
  deg: 4
  nc: 4
  lsqnq: 2
  mumax: 3000000.0
  hratchet: true
  hclear: 0.0
  hrho: 0.01
  hfence: 6
  hfmin: 0.05
  hf0: 0.25
  hgate: 0.005
  hadapt: true
  ratio: true
  statgate: true
  backend: cholmod_sn
  split: 8   # elements per mode
  ineqviol: true
  lowtri: true
  restart: true
  growgate: true
  solveretry: 3
  blowup: 10.0
  blowupretry: 3
  keepbesta: true
  stopgate: 0.0013
  stopinter: 0.0015
  hsteps: 0
  hsmax: 30.0
  feasmu: 1000000.0
  feasscale: false
  feas0: 0.001
  smax0: 40.0
  hmax0: 0.5
  stall: 12
  classic: true
  classicpure: true
  muc: -300000.0
  smaxc: 240.0
  kappa: 4.0
  lsqmetric: 0
  rho: 3000000.0   # LS dynamics-defect weight
  hskip: 20.0
  fastgate: true
  sharejunction: 2
  cplateau: true
  hgrade: 0.6   # geometric grading of the stance elements
  contsplit: 8
  contfence: true
  blockmetric: true
  lagmetric: 16
  lagwarm: 16
  rescuefirst: true
  stopsamp: 64
  cband: 1.0
  hcollapse: 4
  csteps: 1200
output:
  stem: results/sol_fence_g1_29dof
  archive: true
  full_internode: false
  internode_trace: 64
  finegrid_dt: 0.01   # the judge grid
  finegrid_dt2: 0.001   # a second, reported-only grid
