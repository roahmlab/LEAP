# The Hopper fence jump with a posed objective: problems/hopper2d_jump_fence.yaml plus the
# `objective:` block at the end of the file (int ||u||^2 dt and a joint-velocity term over the
# flight), solved in the posed-objective mode (unified.objective=posed, docs/yaml_reference.md).
#
#   OMP_NUM_THREADS=12 build/leap_solve problems/examples/hopper2d_jump_fence_objective.yaml output.stem=results/hopper2d_jump_fence_objective
schema: 1
name: hopper2d_jump_fence_objective_sc
robot: ../../robots/hopper2d.yaml
problem:
  liftofffull: true
  ownership: true
  strictrest: true
  landfootpin: true
  seedmode: 1
  contactposall: true
  type: jump_fence_v2
  tstance: 0.8
  tair: 0.391
  hop: 0.17
  step:
  - 0.405
  - 0.0
  mu: 0.85
  lammin: 5.0
  landvz: 0.5
  footclear: 0.0
  attmax: 0.7
  ulim: 1.0
  selfcolmargin: 0.02
  selfcolinterp: 3
  selfcolpairs:
  - {a: torso, b: shank}
  vlim: 1.0
  qbox: 1.0
  planarlock:
  - base_py
  - base_rx
  - base_rz
  poses:
  - joint: hip
    stand: -0.2202
    squat: -0.4982
  - joint: knee
    stand: 0.4
    squat: 0.9
  ubern: true
  tstanceland: 0.8
  impactcone: true            # friction-cone admissibility of the
                              # plastic touchdown impulse
obstacles:
  margin: 0.02
  interp: 3
  boxes:
  - name: fence
    center:
    - 0.285
    - 0.0
    - 0.04
    size:
    - 0.04
    - 0.6
    - 0.08
solver:
  lsqnqs:
  - 8
  - 8
  - 8
  hnear: 20.0
  deg: 4
  nc: 4
  lsqnq: 2
  mumax: 3000000.0
  hratchet: true
  hclear: 0.0
  hrho: 0.01
  hfence: 6
  hfmin: 0.05
  hf0: 0.25
  hgate: 0.005
  hadapt: true
  ratio: true
  statgate: true
  backend: cholmod_sn
  split: 16
  ineqviol: true
  lowtri: true
  restart: true
  growgate: true
  solveretry: 3
  blowup: 10.0
  blowupretry: 3
  keepbesta: true
  stopgate: 0.0013
  stopinter: 0.0015
  hsteps: 0
  hsmax: 30.0
  feasmu: 1000000.0
  feasscale: false
  feas0: 0.001
  smax0: 40.0
  hmax0: 0.5
  stall: 12
  classic: true
  classicpure: true
  muc: -300000.0
  smaxc: 240.0
  kappa: 4.0
  lsqmetric: 0
  rho: 3000000.0
  hskip: 20.0
  fastgate: true
  sharejunction: 2
  cplateau: true
  hgrade: 0.7746
  contsplit: 8
  contfence: true
  blockmetric: true
  lagmetric: 0
  lagwarm: 16
  rescuefirst: true
  stopsamp: 64
  cband: 1.0
  hcollapse: 4
  csteps: 2000
output:
  stem: results/sol_fence_hopper2d
  archive: true
  full_internode: false
  internode_trace: 64
  finegrid_dt: 0.01
  finegrid_dt2: 0.001

# ---------------------------------------------------------------------------------------
# The objective, composed term by term (tasks/objective.hpp). When this block is present
# it replaces the builder's cost knobs (problem.mineffort, wvel, wacc, ...). The solver
# minimizes it only in the posed-objective mode below; in the default feasibility mode
# (unified.objective=none) the costs are reported, not minimized.
objective:
  quadrature: clenshaw_curtis   # f = sum_e (T_e / 2) sum_k w_k l(z_k): the quadrature of int l dt
  scale: 2.0                    # the solver minimizes scale x f  (2 x 1/2 ||u||^2 = int ||u||^2 dt)
  terms:
    - {type: effort, weight: 1.0}                      # 1/2 ||u||^2 on every element
    - {type: joint_velocity, weight: 20.0, phases: [1]}  # 1/2 w sum v_j^2 over the actuated joints, flight only

unified:
  objective: posed              # phase C descends f + the augmented penalty; stops on the
  objstop: stationary           # first-order certificate (kkttol) + objective plateau (objtol, objwindows)
  kkttol: 1.0e-3
  objtol: 1.0e-3
  objwindows: 2
